description: "Spy on the ads and funnels of the top coaches and course creators through LaunchSpy's hosted MCP server (Streamable HTTP at https://launchspy.io/api/mcp, OAuth sign-in, no keys in config): search creators by niche and country, read their Meta ads with run dates and EU reach, find and take apart their funnels (steps, builder, pixels, payment stack, pricing), and check what is known about any domain. Bundles the launchspy workflow skill. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure: every tool call goes to LaunchSpy's hosted server (launchspy.io) and acts on the user's LaunchSpy account; each tools/call uses one plan credit; the tool set is served by that server at runtime and is not covered by the pinned sha. All six tools are annotated read-only and the server is marked untrusted. Sign-in runs the pinned mcp-remote@0.1.49 through npx (Node.js 20.18.1+ and npm required), which opens a browser and a local callback port on first use and stores OAuth tokens under ~/.mcp-auth."
